<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Fluxo de coleta de vulnerabilidades Linux, Zabbix e Grafana</title><desc id="desc">Coleta diária como root gera um relatório JSON. O agente ativo lê o arquivo a cada trinta minutos. Um item mestre e vinte e quatro dependentes alimentam oito triggers, quatro gráficos e um dashboard. Grafana consulta o Zabbix e atualiza a visualização a cada cinco minutos.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#426a8a"/></marker></defs><rect width="1600" height="920" fill="#f2f5f8"/>
<style>text{font-family:Arial,sans-serif;fill:#233a50}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52697e}.group{fill:white;stroke:#bbcbd8;stroke-width:1.5}.h{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52697e}.mono{font-family:Consolas,monospace;font-size:17px}.line{fill:none;stroke:#426a8a;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="55" y="65" class="title">Fluxo de coleta e visualização</text><text x="55" y="101" class="sub">Baseado nos scripts, no template e no dashboard versionados no projeto.</text>
<rect x="55" y="143" width="555" height="600" rx="10" class="group"/><rect x="700" y="143" width="420" height="600" rx="10" class="group"/><rect x="1220" y="143" width="325" height="600" rx="10" class="group"/>
<text x="81" y="189" class="h">Host Linux</text><text x="81" y="219" class="small">Coleta: root / Leitura: usuário zabbix</text>
<rect x="82" y="245" width="501" height="75" rx="5" fill="#e7eef6"/><text x="102" y="273" class="body">vuln-collect.timer</text><text x="102" y="300" class="small">Uma vez por dia → vuln-collect.service</text><path d="M333 322 V349" class="line"/>
<rect x="82" y="355" width="501" height="65" rx="5" fill="#e7eef6"/><text x="102" y="381" class="body">vuln-collect.py</text><text x="102" y="407" class="small">Agrega achados, status e rankings</text>
<path d="M240 422 V448" class="line"/><path d="M445 422 V448" class="line"/>
<rect x="82" y="453" width="236" height="79" rx="5" fill="#f1f4f7"/><text x="98" y="484" class="body">dnf / yum ou apt</text><text x="98" y="511" class="small">Pacotes da distribuição</text>
<rect x="341" y="453" width="242" height="79" rx="5" fill="#f1f4f7"/><text x="357" y="484" class="body">Trivy rootfs</text><text x="357" y="511" class="small">Pacotes e aplicações</text>
<path d="M240 534 V557 H333 V578" class="line"/><path d="M445 534 V557 H333" fill="none" stroke="#426a8a" stroke-width="2"/>
<rect x="82" y="584" width="501" height="125" rx="5" fill="#e5f0e9" stroke="#a2c5ae"/><text x="102" y="614" class="body">report.json</text><text x="102" y="643" class="mono">/var/lib/zabbix-vuln/report.json</text><text x="102" y="671" class="small">Gravação atômica · arquivo 0644</text><text x="102" y="695" class="small">Diretório 0755 · agente somente lê</text>
<path d="M611 392 H686" class="line"/><text x="650" y="350" class="small" text-anchor="middle">Agente</text><text x="650" y="374" class="small" text-anchor="middle">ativo</text><text x="650" y="420" class="small" text-anchor="middle">30 min</text>
<text x="727" y="189" class="h">Zabbix 7.0</text><text x="727" y="219" class="small">Template vinculado ao host</text>
<rect x="727" y="245" width="366" height="97" rx="5" fill="#e7eef6"/><text x="747" y="278" class="body">1 item mestre</text><text x="747" y="307" class="mono">vfs.file.contents[...]</text><text x="747" y="331" class="small">Lê o JSON a cada 30 minutos</text><path d="M910 344 V369" class="line"/>
<rect x="727" y="377" width="366" height="97" rx="5" fill="#e7eef6"/><text x="747" y="410" class="body">24 itens dependentes</text><text x="747" y="439" class="small">Extração de campos por JSONPath</text><text x="747" y="464" class="small">Contadores, status e rankings</text><path d="M910 476 V501" class="line"/>
<rect x="727" y="509" width="366" height="130" rx="5" fill="#f1f4f7"/><text x="747" y="542" class="body">8 triggers</text><text x="747" y="573" class="body">4 gráficos</text><text x="747" y="604" class="body">1 dashboard / 3 widgets</text><text x="747" y="629" class="small">Histórico e problemas por host</text>
<text x="747" y="681" class="small">Ações de notificação são configuradas</text><text x="747" y="706" class="small">separadamente no Zabbix.</text>
<path d="M1121 392 H1205" class="line"/><text x="1170" y="365" class="small" text-anchor="middle">API</text>
<text x="1247" y="189" class="h">Grafana</text><text x="1247" y="219" class="small">Visualização opcional</text>
<rect x="1247" y="245" width="271" height="97" rx="5" fill="#e7eef6"/><text x="1267" y="279" class="body">Fonte Zabbix</text><text x="1267" y="309" class="small">Métricas e rankings JSON</text><path d="M1383 344 V369" class="line"/>
<rect x="1247" y="377" width="271" height="154" rx="5" fill="#f1f4f7"/><text x="1267" y="411" class="body">Business Text</text><text x="1267" y="445" class="small">Indicadores da frota</text><text x="1267" y="473" class="small">Rankings e filtros</text><text x="1267" y="501" class="small">Mapa de calor</text>
<text x="1267" y="590" class="body">Refresh: 5 min</text><text x="1267" y="623" class="small">Atualiza a visualização.</text><text x="1267" y="650" class="small">Não executa nova coleta.</text>
<rect x="55" y="783" width="1490" height="93" rx="6" fill="#e0eaf3"/><text x="80" y="821" class="body" font-weight="700">Três frequências diferentes</text><text x="80" y="852" class="body">Coleta diária no Linux → leitura do relatório a cada 30 min → refresh do Grafana a cada 5 min.</text></svg>