name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Compilar o script
        run: python -m py_compile src/vuln-collect.py

      - name: Validar o template Zabbix
        run: python tests/validate_template.py

      - name: Testes unitarios
        run: python -m unittest discover -s tests -v

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Referencia do template em dia
        run: |
          python tests/gerar_referencia.py
          git diff --exit-code docs/referencia-template.md

      - name: Fim de linha LF
        run: |
          if grep -rIl $'\r' --exclude-dir=.git . ; then
            echo "Arquivos com CRLF encontrados"; exit 1
          fi
